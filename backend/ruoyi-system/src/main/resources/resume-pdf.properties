# AUTO: extract each page's text; OCR pages without sufficient text.
# OCR: recognize all pages. TEXT: only read embedded text (no OCR).
app.resume.pdf.parser=${RESUME_PDF_PARSER:AUTO}
app.resume.pdf.max-size-mb=10
app.resume.pdf.max-pages=8
app.resume.pdf.dpi=220
app.resume.pdf.page-seg-mode=3
app.resume.pdf.min-text-chars=80
app.resume.pdf.max-concurrent-parses=2
app.resume.pdf.language=chi_sim+eng
# Blank uses the packaged language models; external directory may override them.
app.resume.pdf.tessdata-directory=${RESUME_OCR_TESSDATA:}
# Blank uses the sibling directory "resume-pdf" of ruoyi.profile.
# Must be outside ruoyi.profile, whose files are anonymously accessible.
app.resume.pdf.storage-directory=${RESUME_PDF_STORAGE:}

# OCR/text extraction -> AI schema mapping -> user review -> save.
app.resume.structure.enabled=${RESUME_STRUCTURE_ENABLED:true}
app.resume.structure.api-url=${RESUME_STRUCTURE_API_URL:https://api.deepseek.com/chat/completions}
app.resume.structure.model=${RESUME_STRUCTURE_MODEL:deepseek-chat}
app.resume.structure.api-key=${RESUME_STRUCTURE_API_KEY:}
app.resume.structure.timeout-seconds=60
app.resume.structure.max-tokens=8192
app.resume.structure.max-input-chars=40000
app.resume.structure.max-concurrent-requests=2
