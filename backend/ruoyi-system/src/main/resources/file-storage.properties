# 默认保持本地存储；服务器通过环境变量或外部 Spring 配置启用 RustFS。
app.storage.provider=${FILE_STORAGE_PROVIDER:local}
app.storage.s3.endpoint=${FILE_STORAGE_S3_ENDPOINT:}
app.storage.s3.region=${FILE_STORAGE_S3_REGION:us-east-1}
app.storage.s3.bucket=${FILE_STORAGE_S3_BUCKET:recruit-files}
app.storage.s3.access-key=${FILE_STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${FILE_STORAGE_S3_SECRET_KEY:}
app.storage.s3.path-style=${FILE_STORAGE_S3_PATH_STYLE:true}
app.storage.s3.timeout-seconds=${FILE_STORAGE_S3_TIMEOUT_SECONDS:60}
