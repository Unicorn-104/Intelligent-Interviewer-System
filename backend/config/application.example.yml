# 复制为同目录 application.yml 后填写实际密钥。
# application.yml 已被 Git 忽略；不要在此示例文件中填写真实密钥。
# 从 backend/ 目录启动后端时，Spring Boot 自动加载 config/application.yml。
app:
  ai:
    memory:
      worker-delay-ms: ${CAPP_MEMORY_WORKER_DELAY_MS:2000}
      vector:
        enabled: ${CAPP_MEMORY_VECTOR_ENABLED:true}
        qdrant-url: ${QDRANT_URL:http://127.0.0.1:6333}
        qdrant-api-key: ${QDRANT_API_KEY:}
        collection: ${QDRANT_MEMORY_COLLECTION:capp_user_memory_bge_small_zh_v1}
        embedding-url: ${MEMORY_EMBEDDING_URL:http://127.0.0.1:8091/v1/embeddings}
        embedding-api-key: ${MEMORY_EMBEDDING_TOKEN:}
        embedding-model: ${MEMORY_EMBEDDING_MODEL:BAAI/bge-small-zh-v1.5}
        dimension: ${MEMORY_EMBEDDING_DIMENSION:512}
        min-score: ${MEMORY_MIN_SCORE:0.45}
        connect-timeout-seconds: 3
        request-timeout-seconds: 10
  resume:
    structure:
      enabled: true
      api-url: https://api.deepseek.com/chat/completions
      model: deepseek-chat
      api-key: ""
  # 实时字幕（仅 AI 面试模式 1-3 启用，模式 4 纯人工面试不转写）
  asr:
    enabled: true
    provider: tencent
    degrade-message: 实时字幕暂不可用，已降级为静音模式
    tencent:
      # 腾讯云语音识别 AppID（控制台「语音识别」产品页获取，等待补充）
      app-id: ""
      secret-id: ""
      secret-key: ""
      engine-model-type: 16k_zh
      ws-base-url: wss://asr.cloud.tencent.com/asr/v2
      expire-seconds: 300
      vad-silence-time: 1000

# 视频会议：需要单独部署 LiveKit Server（企业端/候选人端入会令牌与录制推流）。
# url 为客户端直连的 WebSocket 地址；egress-url 为 LiveKit Egress 服务地址，用于录制落库。
livekit:
  api-key: ""
  api-secret: ""
  url: ws://localhost:7880
  token-ttl-seconds: 7200
  egress-url: http://localhost:8089

# 避免 MyBatis DEBUG 日志输出个人记忆、证据和对话原文。
logging:
  level:
    com.ruoyi.system.mapper.app.AppAiMemoryMapper: INFO
    com.ruoyi.system.mapper.app.AppAiMapper: INFO
