# =====================================================================
# 智能招聘面试官系统 Nginx 部署示例配置
# 用法：拷贝到 /etc/nginx/conf.d/，将 server_name 与站点目录替换为真实值
#
# 关键点（缺一不可）：
#   1. client_max_body_size 20m —— 录制分片单片约 3MB，必须放行
#   2. SSE 信令 location 关闭 proxy_buffering —— 否则信令被缓冲无法实时下发
#   3. history 模式回退 try_files —— 否则 /enterprise/conference/prep 等路径 404
#   4. 企业端与候选人端必须反代到【同一个后端实例】—— 否则信令房间无法互通
# =====================================================================

# 后端实例（两端共用）
upstream recruit_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------------- 企业端（HR 控制台） ----------------
server {
    listen 80;
    server_name recruit.example.com;   # TODO: 替换为企业端真实域名

    # 企业端构建产物目录（npm run build:prod 的 dist）
    root /data/sites/enterprise/dist;
    index index.html;

    # 上传体积上限：录制分片 + 简历等附件统一放宽到 20m
    client_max_body_size 20m;

    # Vue Router history 模式回退，防止刷新/直达深层路由 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 视频会议 SSE 信令通道：必须关 buffering，长连接超时放宽
    location /prod-api/system/conference/signal/stream {
        proxy_pass http://recruit_backend/system/conference/signal/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端 API 统一反代（注意 proxy_pass 结尾带 / 以剥掉 /prod-api 前缀）
    location /prod-api/ {
        proxy_pass http://recruit_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ---------------- 候选人端 ----------------
server {
    listen 80;
    server_name cand.example.com;      # TODO: 替换为候选人端真实域名

    # 候选人端构建产物目录
    root /data/sites/candidate/dist;
    index index.html;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 候选人端 SSE 信令（与企业端同一后端实例，房间才能互通）
    location /prod-api/system/conference/signal/stream {
        proxy_pass http://recruit_backend/system/conference/signal/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /prod-api/ {
        proxy_pass http://recruit_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
